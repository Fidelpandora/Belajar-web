<body>

    <div class="container text-center">
        <h1 class="text-danger mt-4">Belajar Pakai Bootstrap</h1>
        <!-- warna di Buttom : 
         primary (biru)
         secondary (abu-abu)
         danger (merah)
         warning (kuning)
         success (hijau)
         info (biru muda)
         dark (hitam)
         light (putih)
         -->
         <button class="btn btn-primary text-info rounded-pill">Klik Saya</button>
         <button class="btn btn-secondary text-dark rounded-pill">Klik Saya</button>
         <button class="btn btn-danger text-primary rounded-pill">Klik Saya</button>

    </div>
